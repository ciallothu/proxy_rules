name: Generate derived rules from Mihomo

on:
  push:
    branches: ["main"]
    paths:
      - "mihomo/**"
      - "tools/generate_derived_rules.py"
      - ".github/workflows/generate-derived-rules.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-derived-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Surge and Loon rule lists
        run: python tools/generate_derived_rules.py

      - name: Commit generated rules
        shell: bash
        run: |
          set -euo pipefail

          git add surge loon

          if git diff --cached --quiet; then
            echo "No generated rule changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: generate Surge and Loon rules from Mihomo"
          git push
