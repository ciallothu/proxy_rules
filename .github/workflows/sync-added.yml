name: Sync added rules between Surge and Mihomo

on:
  push:
    branches: ["main"]
    paths:
      - "surge/added.list"
      - "mihomo/added.yaml"
      - "tools/sync_rules.py"
      - ".github/workflows/sync-added.yml"
  workflow_dispatch:
    inputs:
      direction:
        description: "Sync direction"
        required: true
        default: "surge-to-mihomo"
        type: choice
        options:
          - surge-to-mihomo
          - mihomo-to-surge

permissions:
  contents: write

concurrency:
  group: sync-added-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Determine direction
        id: dir
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "direction=${{ github.event.inputs.direction }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)"
          printf '%s\n' "$CHANGED"

          SURGE_CHANGED=false
          MIHOMO_CHANGED=false

          grep -Fxq "surge/added.list" <<< "$CHANGED" && SURGE_CHANGED=true || true
          grep -Fxq "mihomo/added.yaml" <<< "$CHANGED" && MIHOMO_CHANGED=true || true

          if [[ "$SURGE_CHANGED" == true && "$MIHOMO_CHANGED" == false ]]; then
            echo "direction=surge-to-mihomo" >> "$GITHUB_OUTPUT"
          elif [[ "$SURGE_CHANGED" == false && "$MIHOMO_CHANGED" == true ]]; then
            echo "direction=mihomo-to-surge" >> "$GITHUB_OUTPUT"
          elif [[ "$SURGE_CHANGED" == false && "$MIHOMO_CHANGED" == false ]]; then
            echo "direction=none" >> "$GITHUB_OUTPUT"
          else
            echo "Both surge/added.list and mihomo/added.yaml changed in the same push."
            echo "Refusing to sync because source of truth is ambiguous."
            exit 1
          fi

      - name: Sync Surge -> Mihomo
        if: steps.dir.outputs.direction == 'surge-to-mihomo'
        run: python tools/sync_rules.py surge/added.list mihomo/added.yaml

      - name: Sync Mihomo -> Surge
        if: steps.dir.outputs.direction == 'mihomo-to-surge'
        run: python tools/sync_rules.py mihomo/added.yaml surge/added.list

      - name: Stop if no sync was needed
        if: steps.dir.outputs.direction == 'none'
        run: echo "No source rule file changed."

      - name: Commit & push if changed
        if: steps.dir.outputs.direction != 'none'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          DIR="${{ steps.dir.outputs.direction }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add surge/added.list mihomo/added.yaml
          git commit -m "chore: sync added rules (${DIR})"
          git push
