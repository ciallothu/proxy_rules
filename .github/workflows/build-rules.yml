name: Build consolidated rules

on:
  workflow_dispatch:
  schedule:
    # 04:17 Asia/Shanghai / Asia/Tokyo every day.
    - cron: "17 20 * * *"
  push:
    paths:
      - "tools/build_rules.py"
      - "proxy_added.list"
      - "direct_added.list"
      - "reject_added.list"
      - "proxy.list"
      - "direct.list"
      - "reject.list"
      - "oxidns/**"
      - ".github/workflows/build-rules.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: build-consolidated-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build consolidated rule files
        run: python3 tools/build_rules.py

      - name: Show generated diff
        run: git diff -- proxy.list direct.list reject.list proxy_added.list direct_added.list reject_added.list oxidns/

      - name: Commit generated files
        run: |
          if git diff --quiet -- proxy.list direct.list reject.list proxy_added.list direct_added.list reject_added.list oxidns/; then
            echo "No rule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxy.list direct.list reject.list proxy_added.list direct_added.list reject_added.list oxidns/
          git commit -m "Build consolidated rules"
          git push

      - name: Purge jsDelivr cache
        run: |
          set -u
          sleep 5
          for f in \
            proxy_added.list \
            direct_added.list \
            reject_added.list \
            proxy.list \
            direct.list \
            reject.list \
            oxidns/proxy_added.txt \
            oxidns/direct_added.txt \
            oxidns/reject_added.txt \
            oxidns/proxy.txt \
            oxidns/direct.txt \
            oxidns/reject.txt
          do
            url="https://purge.jsdelivr.net/gh/ciallothu/proxy_rules@main/${f}"
            echo "Purging ${url}"
            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              "${url}" || true
          done
